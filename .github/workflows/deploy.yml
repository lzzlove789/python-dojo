name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认最小权限：构建任务只读，部署任务单独申请 Pages 所需权限
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 固定到提交 SHA（注释里是对应的版本），防止 tag 被改写后夹带恶意代码；
      # 升级由 Dependabot 提 PR（见 .github/dependabot.yml）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      # 严格按 package-lock.json 安装，不会悄悄升级依赖
      - run: npm ci
      # 只检查会进入线上包的依赖；有 high 及以上漏洞则中止部署
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
